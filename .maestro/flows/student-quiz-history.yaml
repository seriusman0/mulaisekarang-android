appId: com.mulaisekarang.app
name: Student reviews quiz attempt history
---
- runFlow: student-login.yaml
- tapOn:
    id: "nav_tab_akun"
- scrollUntilVisible:
    element:
      id: "menu_quiz_history"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "menu_quiz_history"
- assertVisible:
    text: "Riwayat Kuis"
# Either the list or the empty state; both prove the endpoint answered.
- runFlow:
    when:
      visible:
        id: "quiz_attempt_row"
    commands:
      - tapOn:
          id: "quiz_attempt_row"
      # Per-question review is only exposed after submission.
      - assertVisible:
          id: "attempt_detail"
