appId: com.mulaisekarang.app
name: Student opens transaction history
---
- runFlow: student-login.yaml
- tapOn:
    id: "nav_tab_akun"
- scrollUntilVisible:
    element:
      id: "menu_transactions"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "menu_transactions"
- assertVisible:
    text: "Riwayat Transaksi"
