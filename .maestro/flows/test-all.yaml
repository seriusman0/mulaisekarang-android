appId: com.mulaisekarang.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "email_input"
- inputText: "qa-student@mulaisekarang.com"
- tapOn:
    id: "password_input"
- inputText: "QaMobile#2026"
- hideKeyboard
- tapOn:
    id: "login_button"
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 10000

# Lakukan navigasi dan fitur dasar
- tapOn: "BELANJA"
- extendedWaitUntil:
    visible: "Cari kursus atau keahlian baru..."
    timeout: 5000

- tapOn: "AKUN"
- scrollUntilVisible:
    element:
      text: ".*Keluar.*"
    direction: DOWN
- tapOn: ".*Keluar.*"

- extendedWaitUntil:
    visible: "Selamat Datang"
    timeout: 5000
