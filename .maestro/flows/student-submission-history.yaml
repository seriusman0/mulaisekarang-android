appId: com.mulaisekarang.app
name: Student reviews assignment submission history
---
- runFlow: student-login.yaml
- tapOn:
    id: "nav_tab_akun"
- scrollUntilVisible:
    element:
      id: "menu_submission_history"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "menu_submission_history"
- assertVisible:
    text: "Riwayat Tugas"
- assertVisible:
    id: "submission_filter_all"
# Filtering re-queries the API with ?status=graded.
- tapOn:
    id: "submission_filter_graded"
- assertVisible:
    id: "submission_filter_graded"
